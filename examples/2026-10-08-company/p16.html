<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>about-technext</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/scene.css">
<link rel="stylesheet" href="../assets/series.css">
<style>
/* 16 · About TechNext — "Who we are, how we work, where to find us."
   Fresh environment: the TechNext team lounge. Three city windows on one wall (Singapore, Taguig City, Ho Chi Minh City)
   joined by glowing routes; one teammate from each office meets at a standing table, all wearing the TechNext ID. */
:root{--acc:#3167CA;--acc-l:#EAF1FC;--acc-d:#2552A6}
.city{position:absolute;z-index:5;background:#fff;border-radius:14px;padding:10px 14px 11px;box-shadow:0 2px 6px rgba(31,31,61,.07),0 16px 32px -18px rgba(31,31,61,.4);text-align:center}
.city b{display:block;font:800 19px/1.15 var(--font-display);color:var(--ink)}
.city span{display:block;font:600 15px/1.25 var(--font-body);color:var(--label);margin-top:3px}
.c1{left:72px;top:850px;width:266px}.c2{left:407px;top:850px;width:266px}.c3{left:742px;top:850px;width:266px}
.c1 b::before,.c2 b::before,.c3 b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-right:7px;vertical-align:2px}
</style></head>
<body><div class="f">
  <canvas id="scene" data-qa-skip></canvas>
  <svg id="flow" viewBox="0 0 1080 1440" data-qa-skip></svg>
  <div class="sp-logos"><img class="sp-tn" src="../assets/sp/technext-horizontal-blue.svg" alt="TechNext"><img class="sp-odoo" src="../assets/sp/odoo-logo.png" alt="Odoo"></div>

  <div class="tp-chip" data-qa="chip"><i><img src="../assets/img/logo-plane.png" alt=""></i>Company · <b>About TechNext</b></div>
  <h1 class="tp-h" data-qa="headline">We automate <em>what slows you down.</em></h1>
  <p class="tp-sub" data-qa="sub">Odoo ERP and enterprise AI, <b>one team across three offices.</b></p>

  <div class="city c1" data-qa="city-sg"><b>Singapore</b><span>Headquarters</span></div>
  <div class="city c2" data-qa="city-ph"><b>Taguig City</b><span>Development &amp; consulting hub</span></div>
  <div class="city c3" data-qa="city-vn"><b>Ho Chi Minh City</b><span>AI engineering hub</span></div>

  <div class="sp-foot"><span class="sp-url soft" data-qa="url">technext.asia/company</span></div>
</div>
<script src="../assets/js/industry-world.js"></script>
<script src="../assets/scene-post.js"></script>
<script>
SP.draw(function (g, K, H) {
  // post px throughout (no set transform): lounge wall, three framed city windows, floor, the team
  var FY = 1150;                                   // floor line
  H.grad(g, 0, 0, 1080, FY, '#F4F7FC', '#E7EEF8');
  g.fillStyle = 'rgba(49,103,202,.05)'; for (var x = 0; x < 1080; x += 90) g.fillRect(x, 520, 2, FY - 520);
  H.grad(g, 0, FY - 210, 1080, 210, '#DCE6F4', '#D2DEF0'); g.fillStyle = '#FFFFFF'; g.fillRect(0, FY - 216, 1080, 8);
  H.grad(g, 0, FY, 1080, 1440 - FY, '#EEF2F8', '#D9E2EE');
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2; g.beginPath(); for (var d = 1; d < 8; d++) { var yy = FY + Math.pow(d / 7, 1.6) * (1440 - FY); g.moveTo(0, yy); g.lineTo(1080, yy); } for (var i = -12; i <= 12; i++) { g.moveTo(540 + i * 80, FY); g.lineTo(540 + i * 210, 1440); } g.stroke();
  // three city windows
  function win(x, sky1, sky2, draw) {
    var w = { x: x, y: 600, w: 266, h: 230 };
    K.shadowed(g, 22, 8, .18, function () { K.fillRR(g, w.x - 12, w.y - 12, w.w + 24, w.h + 24, 18, '#FFFFFF'); });
    g.save(); K.rr(g, w.x, w.y, w.w, w.h, 8); g.clip(); H.grad(g, w.x, w.y, w.w, w.h, sky1, sky2); draw(w); K.windowGlass(g, w); g.restore();
    return w;
  }
  var bld = function (w, list, col) { g.fillStyle = col; list.forEach(function (b) { K.fillRR(g, w.x + b[0], w.y + w.h - b[1], b[2], b[1] + 10, 3, col); }); };
  var wSG = win(72, '#9ED8FA', '#E8F6FF', function (w) {
    K.cloud(g, w.x + 40, w.y + 50, .22);
    bld(w, [[10, 70, 34], [48, 110, 28], [200, 90, 40], [236, 60, 30]], '#8FB3D9');
    // three-tower hotel with the roof deck
    [[96, 124], [128, 132], [160, 124]].forEach(function (t) { K.fillRR(g, w.x + t[0], w.y + w.h - t[1], 24, t[1], 3, '#6E93C2'); });
    K.fillRR(g, w.x + 88, w.y + w.h - 142, 104, 14, 7, '#5A7FB0');
    K.fillE(g, w.x + 60, w.y + w.h - 12, 40, 10, '#7FB2D6');
  });
  var wPH = win(407, '#A8DCF7', '#EDF8FF', function (w) {
    K.cloud(g, w.x + 150, w.y + 46, .24);
    bld(w, [[14, 120, 40], [60, 160, 36], [102, 130, 44], [152, 176, 38], [196, 110, 50]], '#8CB0D4');
    g.fillStyle = 'rgba(255,255,255,.55)'; for (var r = 0; r < 8; r++) for (var c = 0; c < 5; c++) g.fillRect(w.x + 18 + c * 46, w.y + w.h - 100 + r * 12, 8, 5);
    K.fillE(g, w.x + 133, w.y + w.h - 4, 140, 14, '#7CC48B');
  });
  var wVN = win(742, '#B5E0F5', '#F2FAFF', function (w) {
    K.cloud(g, w.x + 30, w.y + 60, .2);
    bld(w, [[10, 90, 40], [56, 70, 34], [180, 100, 36], [222, 64, 34]], '#93B5D8');
    // the tall tapering tower
    g.fillStyle = '#6C90C0'; g.beginPath(); g.moveTo(w.x + 110, w.y + w.h); g.lineTo(w.x + 118, w.y + 30); g.lineTo(w.x + 133, w.y + 10); g.lineTo(w.x + 148, w.y + 30); g.lineTo(w.x + 156, w.y + w.h); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(w.x + 131, w.y + 30, 3, w.h - 30);
    K.fillRR(g, w.x - 4, w.y + w.h - 18, w.w + 8, 22, 4, '#9CC7E0');
  });
  // standing table + plant + the three teammates (one per office), TechNext IDs
  K.plant(g, { x: 70, y: 1210 }, '#F59A8B', '#F7AE9F');
  H.pool(g, 540, 1240, 420, 60, .55);
  var ppl = [
    { x: 300, top: '#3167CA', hair: '#1E1A1A', skin: '#EDC4A2', style: 'short', outfit: 'polo', glasses: true, look: .5 },
    { x: 540, top: '#F2B544', hair: '#231816', skin: '#D9A27A', style: 'pony', outfit: 'tee', look: 0, talk: true },
    { x: 780, top: '#5AA28A', hair: '#1A1615', skin: '#E6B48E', style: 'long', outfit: 'hoodie', look: -.5 }];
  ppl.forEach(function (p, n) {
    H.person(g, H.who({ x: p.x, y: 1300, s: .78, ph: n * 1.3, c: { skin: p.skin, hair: p.hair, top: p.top, top2: '#FFFFFF', low: '#2A3550', shoe: '#2A2F45' }, outfit: p.outfit, hairStyle: p.style, glasses: p.glasses,
      idcard: '#3167CA', short: p.outfit === 'polo', mood: 'happy', look: p.look, talk: p.talk, hands: [[-74, -170], [74, -170]] }));
  });
  K.shadowed(g, 18, 8, .18, function () { K.fillRR(g, 400, 1150, 280, 20, 10, '#FFFFFF'); });
  K.fillRR(g, 528, 1170, 24, 120, 6, '#C9D3E3'); K.fillE(g, 540, 1292, 70, 10, '#C9D3E3');
  K.fillRR(g, 470, 1112, 92, 40, 6, '#2A3550'); K.fillRR(g, 462, 1148, 108, 6, 3, '#3B4A66'); K.fillRR(g, 476, 1118, 80, 28, 4, '#EAF1FC'); K.fillRR(g, 482, 1124, 40, 5, 2, '#3167CA');
  K.fillRR(g, 590, 1124, 28, 26, 6, '#FFFFFF'); K.fillRR(g, 594, 1128, 20, 8, 3, '#C98E55');
  H.vignette(g, .08);
  // routes: Singapore HQ to Taguig and to Ho Chi Minh City (dashed, glowing), pins on each window
  var pin = function (w) { return [w.x + w.w / 2, w.y - 34]; }, a = pin(wSG), b = pin(wPH), c2 = pin(wVN);
  function arc(p, q, h) { return 'M' + p[0] + ' ' + p[1] + ' Q ' + ((p[0] + q[0]) / 2) + ' ' + (p[1] - h) + ' ' + q[0] + ' ' + q[1]; }
  var s = '<defs><filter id="gl" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="5"/></filter></defs>';
  [[a, b, 34], [a, c2, 64]].forEach(function (r) { s += '<path d="' + arc(r[0], r[1], r[2]) + '" fill="none" stroke="#8FB4F0" stroke-width="10" opacity=".5" filter="url(#gl)"/>' +
    '<path d="' + arc(r[0], r[1], r[2]) + '" fill="none" stroke="#3167CA" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>'; });
  // a little paper plane travelling the long route
  s += '<g transform="translate(' + ((a[0] + c2[0]) / 2 + 150) + ' ' + (a[1] - 40) + ') rotate(14)"><path d="M18 -12 L-18 2 L-6 5 L-2 17 L4 7 Z" fill="#3167CA"/><path d="M18 -12 L-6 5 L-2 17 Z" fill="#2552A6"/></g>';
  [a, b, c2].forEach(function (p) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="13" fill="#3167CA" stroke="#fff" stroke-width="5"/><line x1="' + p[0] + '" y1="' + (p[1] + 13) + '" x2="' + p[0] + '" y2="' + (p[1] + 34) + '" stroke="#3167CA" stroke-width="4"/>'; });
  document.getElementById('flow').innerHTML = s;
});
</script>
</body></html>
